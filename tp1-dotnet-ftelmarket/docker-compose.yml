name: ftelmarket

services:
  ftelmarket-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ftelmarket-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FtelMarket#2026"
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ftelmarket-api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: ftelmarket-api
    working_dir: /src
    # Rechargement à chaud : les sources sont montées, toute modification relance l'API.
    command: dotnet watch run --non-interactive --no-launch-profile
    ports:
      - "5082:5082"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5082"
      # Dans le réseau Docker, la BDD est joignable par le nom de son service, pas par localhost.
      ConnectionStrings__FtelMarket: "Server=ftelmarket-sqlserver,1433;Database=FtelMarket;User Id=sa;Password=FtelMarket#2026;TrustServerCertificate=True"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - ./FTELMarket:/src
      # bin/obj propres au conteneur pour ne pas entrer en conflit avec le build de l'hôte.
      - api-bin:/src/bin
      - api-obj:/src/obj
      - nuget-packages:/root/.nuget/packages
    depends_on:
      ftelmarket-sqlserver:
        condition: service_healthy

  ftelmarket-front:
    image: node:22-alpine
    container_name: ftelmarket-front
    working_dir: /app
    command: >
      sh -c "corepack enable
      && corepack prepare pnpm@10.11.0 --activate
      && pnpm install --frozen-lockfile
      && pnpm dev:app --host 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      VITE_BASE_URL: "http://localhost:3000"
      VITE_API_BASE_URL: "http://localhost:5082/api"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CHOKIDAR_USEPOLLING: "true"
      npm_config_store_dir: /pnpm-store
      NODE_COMPILE_CACHE: /tmp/node-compile-cache
    volumes:
      - ./FTEL-MARKET-FRONT:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm-store
    depends_on:
      - ftelmarket-api

volumes:
  sqlserver-data:
  api-bin:
  api-obj:
  nuget-packages:
  node_modules:
  pnpm-store:
